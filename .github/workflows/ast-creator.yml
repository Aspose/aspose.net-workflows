name: AST Creator

# Builds the AST JSON for the English source of the given families and publishes
# it as a workflow artifact.
#
# The AST is derived data (/ast is gitignored in Aspose/aspose.net), so it is NOT
# committed or pushed. ast-translator and ast2md-converter regenerate it from
# `content/` themselves, which keeps all three workflows deterministic and
# independent of a previously pushed snapshot. Run this workflow to check that
# the English source parses cleanly before starting a (slow) translation run.

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "Target subdomain (e.g., reference.aspose.net or kb.aspose.net)"
        required: true
        default: "reference.aspose.net"
      families:
        description: "Comma-separated list of families (e.g., pdf,words,cells)"
        required: true
        default: "pdf"
  workflow_call:
    inputs:
      subdomain:
        required: true
        type: string
      families:
        required: true
        type: string
    secrets:
      REPO_TOKEN:
        required: true

jobs:
  create_ast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aspose/aspose.net Repository
        uses: actions/checkout@v4
        with:
          repository: Aspose/aspose.net
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AST Creator dependencies
        run: pip install mistune python-frontmatter beautifulsoup4 pyyaml

      - name: Run AST Creator Script (one family at a time)
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra FAMS <<< "${{ inputs.families }}"
          for fam in "${FAMS[@]}"; do
            fam="$(echo -n "$fam" | xargs)"
            [ -z "$fam" ] && continue
            src="content/${{ inputs.subdomain }}/${fam}"
            if [ ! -d "$src/en" ]; then
              echo "::error::No English source folder: $src/en"
              exit 1
            fi
            echo "== AST for ${{ inputs.subdomain }}/${fam}"
            python scripts/ast-translator/ast-creator.py --input "$src"
            count=$(find "ast/${{ inputs.subdomain }}/${fam}/en" -name '*.json' | wc -l)
            echo "AST files for ${fam}: ${count}"
            if [ "$count" -eq 0 ]; then
              echo "::error::AST creator produced no files for ${fam}"
              exit 1
            fi
          done

      - name: Upload AST Files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ast-files
          path: ./ast
