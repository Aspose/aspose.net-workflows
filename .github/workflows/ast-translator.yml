name: AST Translator

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "Target subdomain (e.g., reference.aspose.net)"
        required: true
        default: 'reference.aspose.net'
      families:
        description: "Comma-separated list of families to process (e.g., words,cells,barcode)"
        required: true
        default: 'words,cells,barcode'
      languages:
        description: "Comma-separated target languages (e.g., zh,es,fr), or 'auto' to use every locale folder that exists for the family in Aspose/aspose.net"
        required: false
        default: 'auto'
  workflow_call:
    inputs:
      subdomain:
        required: true
        type: string
      families:
        required: true
        type: string
      languages:
        required: false
        type: string
        default: 'auto'
    secrets:
      REPO_TOKEN:
        required: true
jobs:
  prepare-matrix:
    name: Prepare Family-Language Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - name: Checkout Aspose/aspose.net (to derive locales)
        uses: actions/checkout@v4
        with:
          repository: Aspose/aspose.net
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1

      - name: Convert families and languages inputs to JSON array of objects
        id: set_matrix
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra FAM_LIST <<< "${{ inputs.families }}"
          REQUESTED="$(echo -n "${{ inputs.languages }}" | xargs)"
          elements=()
          for fam in "${FAM_LIST[@]}"; do
            fam="$(echo -n "$fam" | xargs)"
            if [[ -z "$fam" ]]; then continue; fi
            if [[ -z "$REQUESTED" || "$REQUESTED" == "auto" ]]; then
              # Derive from the repo: every locale folder next to .../<family>/en
              LANGS="$(python3 scripts/ast-translator/list_locales.py --content-root content --subdomain "${{ inputs.subdomain }}" --family "$fam")"
            else
              LANGS="$REQUESTED"
            fi
            echo "Languages for ${fam}: ${LANGS}"
            IFS=',' read -ra LANG_LIST <<< "$LANGS"
            for lang in "${LANG_LIST[@]}"; do
              lang="$(echo -n "$lang" | xargs)"
              if [[ -z "$lang" ]]; then continue; fi
              elements+=("{\"family\": \"${fam}\", \"language\": \"${lang}\"}")
            done
          done
          if [[ ${#elements[@]} -eq 0 ]]; then
            echo "::error::No family/language combinations to translate"
            exit 1
          fi
          json="[$(IFS=,; echo "${elements[*]}")]"
          echo "matrix=$json" >> $GITHUB_OUTPUT
          echo "Matrix size: ${#elements[@]}"

  translate:
    name: Translate AST Files
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - name: Checkout aspose.net repository
        uses: actions/checkout@v4
        with:
          repository: Aspose/aspose.net
          path: aspose-net
          token: ${{ secrets.REPO_TOKEN }}
          # Only the scripts and the English source are read here; the
          # translation output goes to the translationcache repo.
          fetch-depth: 1

      - name: Checkout translationcache repository
        uses: actions/checkout@v4
        with:
          repository: smallize/translationcache
          path: translationcache
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel (runners have no GPU; avoids multi-GB CUDA downloads)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # accelerate is imported at module level by ast-translator.py
          pip install transformers sentencepiece accelerate
          # ast-creator.py dependencies (the AST is regenerated from content/ below)
          pip install mistune python-frontmatter beautifulsoup4 pyyaml

      - name: Generate AST from the English source
        shell: bash
        run: |
          set -euo pipefail
          src="aspose-net/content/${{ inputs.subdomain }}/${{ matrix.family }}"
          test -d "$src/en" || { echo "::error::No English source folder: $src/en"; exit 1; }
          python aspose-net/scripts/ast-translator/ast-creator.py --input "$src"
          count=$(find "aspose-net/ast/${{ inputs.subdomain }}/${{ matrix.family }}/en" -name '*.json' | wc -l)
          echo "AST files: $count"
          test "$count" -gt 0

      - name: Extract translatable strings (nodes.txt)
        shell: bash
        run: |
          set -euo pipefail
          # ast-translator.py takes a text file of source strings, not an AST folder.
          python aspose-net/scripts/ast-translator/ast-filter.py \
            --input "aspose-net/ast/${{ inputs.subdomain }}/${{ matrix.family }}/en" --overwrite
          lines=$(grep -c . aspose-net/scripts/ast-translator/nodes.txt || true)
          echo "Translatable lines: $lines"
          test "$lines" -gt 0

      - name: Configure Git Identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run AST Translation with Watchdog
        shell: bash
        env:
          # The translator wraps the model in torch.compile(max-autotune); on a CPU
          # runner that compile time dwarfs a small incremental run. Disable it.
          TORCHDYNAMO_DISABLE: "1"
        run: |
          # This step runs both the AST translation and a watchdog that monitors its runtime.
          START_TIME=$(date +%s)
          WATCHDOG_THRESHOLD=19800  # 5 hours 30 minutes in seconds
          # Branch of the translationcache repo (NOT this workflow's own ref: the
          # workflow may be dispatched from any branch of aspose.net-workflows).
          TC_BRANCH="$(git -C translationcache rev-parse --abbrev-ref HEAD)"

          # Define the cleanup function to merge and push the partial cache.
          cleanup() {
            echo "Watchdog triggered: Running cleanup process..."
            LANG="${{ matrix.language }}"
            LOCAL_FILE="aspose-net/translation/${LANG}_cache.json"
            REMOTE_FILE="translationcache/${LANG}_cache.json"
            if [ ! -f "$REMOTE_FILE" ]; then
              echo "{}" > "$REMOTE_FILE"
            fi
            # Merge and validate the partial cache.
            python aspose-net/scripts/json-merger/merge.py --input1 "$REMOTE_FILE" --input2 "$LOCAL_FILE" --output "$REMOTE_FILE"
            python aspose-net/scripts/json-merger/validate.py --file "$REMOTE_FILE" --fix

            # Perform Git operations in the translationcache repository.
            cd translationcache
            git fetch origin
            git reset --hard origin/"$TC_BRANCH"
            cd ..
            cd translationcache
            git add *.json
            # Updated commit message including subdomain, family, and language.
            commit_message="Watchdog commit for ${{ inputs.subdomain }}, family: ${{ matrix.family }}, language: ${{ matrix.language }} (Partial translation)"
            git commit -m "$commit_message" || echo "Nothing to commit"
            if git push origin "$TC_BRANCH"; then
              echo "Cleanup push successful."
            else
              echo "Cleanup push failed."
            fi
            cd ..
            # Create a marker file so that subsequent steps can detect that cleanup occurred.
            touch .watchdog_triggered
          }

          # Start the AST translation process in the background.
          echo "Starting AST translation for subdomain: ${{ inputs.subdomain }}, family: ${{ matrix.family }}, language: ${{ matrix.language }}..."
          python aspose-net/scripts/ast-translator/ast-translator.py \
            --input aspose-net/scripts/ast-translator/nodes.txt \
            --cache_folder aspose-net/translation \
            --device auto \
            --target_languages "${{ matrix.language }}" \
            --batch_size 6 \
            --existing_cache_folder translationcache &
          TRANSLATION_PID=$!

          # Monitor the AST translation process.
          while kill -0 $TRANSLATION_PID 2>/dev/null; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$(( CURRENT_TIME - START_TIME ))
            if [ $ELAPSED -ge $WATCHDOG_THRESHOLD ]; then
              echo "AST translation has exceeded the allowed time of 5 hours 30 minutes ($WATCHDOG_THRESHOLD seconds)."
              cleanup
              echo "Killing AST translation process..."
              kill $TRANSLATION_PID || true
              wait $TRANSLATION_PID || true
              exit 0
            fi
            sleep 60
          done
          # If the translation process finishes before the threshold:
          wait $TRANSLATION_PID

      - name: Merge and Push Updated Translation Cache
        shell: bash
        env:
          GIT_AUTHOR_NAME: GitHub Actions
          GIT_AUTHOR_EMAIL: actions@github.com
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          # If the watchdog cleanup already ran, skip final merge.
          if [ -f .watchdog_triggered ]; then
            echo "Watchdog cleanup already performed. Skipping final merge and push."
            exit 0
          fi
          LANG="${{ matrix.language }}"
          TC_BRANCH="$(git -C translationcache rev-parse --abbrev-ref HEAD)"
          echo "Final merge and push process starting for language: $LANG..."
          LOCAL_FILE="aspose-net/translation/${LANG}_cache.json"
          REMOTE_FILE="translationcache/${LANG}_cache.json"
          if [ ! -s "$LOCAL_FILE" ]; then
            echo "Local cache file $LOCAL_FILE is empty. Skipping merge for language $LANG."
            exit 0
          fi
          if [ ! -f "$REMOTE_FILE" ]; then
            echo "{}" > "$REMOTE_FILE"
          fi
          
          for attempt in {1..10}; do
            echo "Final commit attempt #$attempt"
            cd translationcache
            git fetch origin
            git reset --hard origin/"$TC_BRANCH"
            cd ..
            python aspose-net/scripts/json-merger/merge.py --input1 "$REMOTE_FILE" --input2 "$LOCAL_FILE" --output "$REMOTE_FILE"
            python aspose-net/scripts/json-merger/validate.py --file "$REMOTE_FILE" --fix
            cd translationcache
            git add *.json
            commit_message="Final translation cache commit for ${{ inputs.subdomain }}, family: ${{ matrix.family }}, language: $LANG"
            git commit -m "$commit_message" || echo "Nothing to commit"
            if git push origin "$TC_BRANCH"; then
              echo "Final push successful."
              exit 0
            else
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
              cd ..
            fi
          done
          echo "Final push failed after multiple attempts."
          exit 1