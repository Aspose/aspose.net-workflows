name: gsc-query-collector

# TC-SYS-131 (aspose.net SEO keyword program, Stage 2): the collector
# script this workflow calls (Aspose/aspose.net scripts/google/
# query-collector.py) was upgraded at TC-SYS-108 to emit a richer
# `queries[]` list per page (clicks, impressions, ctr, position, sorted
# by impressions, with a --min-impressions filter) alongside the
# existing legacy `keywords[]` list, which it still writes for backward
# compatibility -- no change needed here for that alone, since --subdomain
# and --base-dir are unchanged and checkout@v3 always pulls the current
# aspose.net main (which now has the upgrade).
#
# What THIS change adds: an optional `canary_subdomain` manual-dispatch
# input that restricts a run to exactly one subdomain, so the new
# collector's real output can be verified in production for one site
# before relying on the full five-site scheduled run. Leaving the input
# blank (including every scheduled run, which never sets it) preserves
# the exact original five-site behavior unchanged.

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at 00:00
  workflow_dispatch:
    inputs:
      canary_subdomain:
        description: 'Canary: restrict this run to one subdomain (leave blank for all five)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - docs.aspose.net
          - blog.aspose.net
          - kb.aspose.net
          - reference.aspose.net
          - products.aspose.net

jobs:
  determine_matrix:
    runs-on: ubuntu-latest
    outputs:
      subdomains: ${{ steps.set.outputs.subdomains }}
    steps:
      - name: Compute the subdomain list for this run
        id: set
        run: |
          if [ -n "${{ github.event.inputs.canary_subdomain }}" ]; then
            echo 'subdomains=["${{ github.event.inputs.canary_subdomain }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'subdomains=["docs.aspose.net","blog.aspose.net","kb.aspose.net","reference.aspose.net","products.aspose.net"]' >> "$GITHUB_OUTPUT"
          fi

  update_queries:
    needs: determine_matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subdomain: ${{ fromJson(needs.determine_matrix.outputs.subdomains) }}
    env:
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
    steps:
      - name: Checkout aspose.net repository
        uses: actions/checkout@v3
        with:
          # Updated repository location – note the correct casing for the organization
          repository: Aspose/aspose.net
          token: ${{ secrets.REPO_TOKEN }}
          path: checked_out_repo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run keyword extraction for ${{ matrix.subdomain }}
        run: |
          python checked_out_repo/scripts/google/query-collector.py --subdomain ${{ matrix.subdomain }} --base-dir checked_out_repo/keywords

      - name: Commit and push changes for ${{ matrix.subdomain }}
        working-directory: checked_out_repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # Explicitly update remote URL in case of caching
          git remote set-url origin https://github.com/Aspose/aspose.net.git
          # Pull latest changes to avoid conflicts
          git pull --rebase --autostash origin main
          git add keywords/
          git diff --cached --quiet || git commit -m "Update queries for ${{ matrix.subdomain }}"
          git push origin main || echo "Push failed due to concurrent update. Consider handling merge conflicts."
